# Done to increase the memory available to Gradle.
# Remapping the VS2 classpath needs more than the template's default 2G.
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true

# Meta dependency
kotlin_version=2.0.0

# Mod properties
mod_version = 1.0.0
mod_id = enderkinesis
maven_group = org.shipwrights
archives_base_name = enderkinesis
enabled_platforms = fabric,forge

# Minecraft properties
minecraft_version = 1.20.1

# Dependencies
architectury_api_version = 9.1.12
# Match the VS2 1.20.1/playtest branch. Using the old template defaults makes Loom mis-remap
# the VS2 classpath -> AbstractMethodError at runtime.
fabric_loader_version = 0.17.2
fabric_api_version = 0.92.6+1.20.1
forge_version = 47.4.10

# VS dependencies
# Enderkinesis targets the VS2 1.20.1/playtest branch until it is merged. These pin the HEAD of
# that branch, published on the Valkyrien Skies maven. To bump: take the first 10 chars of the
# new playtest commit for vs2_version, and read vs_core_version from that commit's
# gradle.properties for vscore_version.
vs2_version=2.4.13+c3fbe5f60e
vscore_version=1.1.0+af5183035b

create_fabric_version=6.0.7.0+build.1728-mc1.20.1
create_forge_version=6.0.7-281

# Kotlin platform dependencies
kotlin_forge=4.11.0
kotlin_fabric=1.11.0+kotlin.2.0.0

# Leave blank, only ever set in CI tasks.
vs_maven_url=
vs_maven_username=
vs_maven_password=
