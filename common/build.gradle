architectury {
    common rootProject.enabled_platforms.split(',')
}

test {
    useJUnitPlatform()
}

sourceSets {
    test.kotlin.srcDirs += "src/test/kotlin"
}

dependencies {
    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get remapped to the correct annotations on each platform.
    // Do NOT use other classes from Fabric Loader.
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    implementation("io.github.llamalad7:mixinextras-common:0.4.1")
    // Register the MixinExtras annotation processor on common-module
    // compilation. Without this, the refmap generated by Loom is
    // MISSING the `method` / `target` entries for any @WrapOperation
    // (or other MixinExtras-specific annotation) — at runtime the
    // unmapped Mojang name leaks through to the Fabric intermediary
    // classpath and the injection fails ("could not find any targets
    // matching '<mojang-name>'"). Standard mixin annotations (@Inject
    // etc.) work without this because Loom recognises them natively.
    annotationProcessor("io.github.llamalad7:mixinextras-common:0.4.1")

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modImplementation "dev.architectury:architectury:$rootProject.architectury_api_version"

    modApi("org.valkyrienskies:valkyrienskies-120-common:${rootProject.vs2_version}") {
        exclude group: "com.simibubi"
        exclude group: "io.github.fabricators_of_create"
        exclude group: "dev.engine-room"
        exclude group: "dev.engine_room"
    }
    implementation("org.valkyrienskies.core:api:${rootProject.vscore_version}") {
        exclude group: 'org.joml', module: ''
    }
    implementation("org.valkyrienskies.core:impl:${rootProject.vscore_version}") {
        exclude group: 'org.joml', module: ''
    }
    implementation("org.valkyrienskies.core:internal:${rootProject.vscore_version}") {
        exclude group: 'org.joml', module: ''
    }

    implementation("org.joml:joml-primitives:1.10.0")
    implementation("org.joml:joml:1.10.4")

    modCompileOnly("com.simibubi.create:create-fabric:${rootProject.create_fabric_version}")


    // For unit testing.
    var kotestVersion = "5.4.1"
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.1'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.1'
    testImplementation("io.kotest:kotest-runner-junit5:$kotestVersion")
    testImplementation("io.kotest:kotest-property:$kotestVersion")
    testImplementation("io.kotest:kotest-assertions-core:$kotestVersion")
    testImplementation("io.mockk:mockk:1.12.5")
}

sourceSets {
    main {
        resources {
            srcDir layout.buildDirectory.dir("generated/sselith")
        }
    }
}

tasks.register("downloadSselithModels") {
    group = "sselith"
    description = "Fetch OpenNLP English POS-tagging and lemmatizer model files used by translateSselith."

    def modelsDir = rootProject.file("buildSrc/src/main/resources/models")
    def posModel = new File(modelsDir, "en-pos-maxent.bin")
    def lemmaDict = new File(modelsDir, "en-lemmatizer.dict")

    outputs.files posModel, lemmaDict

    doLast {
        def fetch = { String url, File dest ->
            if (dest.exists() && dest.length() > 0) {
                logger.info "Already present: ${dest.name}"
                return
            }
            logger.lifecycle "Downloading ${dest.name} from ${url}"
            def connection = new java.net.URL(url).openConnection()
            connection.setRequestProperty("User-Agent", "enderkinesis-build")
            connection.setInstanceFollowRedirects(true)
            connection.connect()
            dest.withOutputStream { os ->
                connection.inputStream.withCloseable { is -> os << is }
            }
        }
        modelsDir.mkdirs()
        fetch("https://opennlp.sourceforge.net/models-1.5/en-pos-maxent.bin", posModel)
        fetch("https://raw.githubusercontent.com/richardwilly98/elasticsearch-opennlp-auto-tagging/master/src/main/resources/models/en-lemmatizer.dict", lemmaDict)
    }
}

tasks.register("translateSselith", JavaExec) {
    group = "sselith"
    description = "Translate English book sources to Sselith and place in generated resources."

    def translatorRuntime = project.configurations.detachedConfiguration(
        project.dependencies.create("org.apache.opennlp:opennlp-tools:2.5.4"),
        project.dependencies.create("com.google.code.gson:gson:2.11.0")
    )

    classpath = files(
        rootProject.file("buildSrc/build/classes/java/main"),
        rootProject.file("buildSrc/build/resources/main")
    ) + translatorRuntime

    mainClass = "sselith.translator.TranslatorMain"

    def sourceDir = file("src/main/resources/assets/enderkinesis/texts/sselith/books")
    def outputDir = layout.buildDirectory.dir("generated/sselith/assets/enderkinesis/texts/sselith/books").get().asFile
    def dictPath = file("src/main/resources/assets/enderkinesis/texts/sselith/dictionary/sselith_dictionary.json")
    def posModelPath = rootProject.file("buildSrc/src/main/resources/models/en-pos-maxent.bin")
    def lemmaDictPath = rootProject.file("buildSrc/src/main/resources/models/en-lemmatizer.dict")

    inputs.dir sourceDir
    inputs.file dictPath
    inputs.file posModelPath
    inputs.file lemmaDictPath
    outputs.dir outputDir

    args = [
        "books",
        sourceDir.absolutePath,
        outputDir.absolutePath,
        dictPath.absolutePath,
        posModelPath.absolutePath,
        lemmaDictPath.absolutePath
    ]

    dependsOn tasks.named("downloadSselithModels")
}

tasks.register("translateLangJson", JavaExec) {
    group = "sselith"
    description = "Translate vanilla + mod en_us.json to en_se.json so Minecraft offers Sselith as a selectable language."

    def translatorRuntime = project.configurations.detachedConfiguration(
        project.dependencies.create("org.apache.opennlp:opennlp-tools:2.5.4"),
        project.dependencies.create("com.google.code.gson:gson:2.11.0")
    )

    classpath = files(
        rootProject.file("buildSrc/build/classes/java/main"),
        rootProject.file("buildSrc/build/resources/main")
    ) + translatorRuntime

    mainClass = "sselith.translator.TranslatorMain"

    // Resolve mcJar lazily — the path doesn't need to exist at configuration time.
    def mcJar = file("${gradle.gradleUserHomeDir}/caches/fabric-loom/${rootProject.minecraft_version}/minecraft-merged.jar")
    // Output goes into a built-in pack at resourcepacks/sselith/, NOT the mod root: Fabric's
    // composite "Mod resources" pack mints its own pack.mcmeta with only pack_format +
    // description, dropping any `language` block declared on the mod's own pack.mcmeta.
    def vanillaOut = layout.buildDirectory.file("generated/sselith/resourcepacks/sselith/assets/minecraft/lang/en_se.json").get().asFile
    def modIn = file("src/main/resources/assets/enderkinesis/lang/en_us.json")
    def modOut = layout.buildDirectory.file("generated/sselith/resourcepacks/sselith/assets/enderkinesis/lang/en_se.json").get().asFile
    def dictPath = file("src/main/resources/assets/enderkinesis/texts/sselith/dictionary/sselith_dictionary.json")
    def posModelPath = rootProject.file("buildSrc/src/main/resources/models/en-pos-maxent.bin")
    def lemmaDictPath = rootProject.file("buildSrc/src/main/resources/models/en-lemmatizer.dict")

    inputs.file modIn
    inputs.file dictPath
    inputs.file posModelPath
    inputs.file lemmaDictPath
    // mcJar deliberately NOT declared as an input: it would fail cold runs before Loom has downloaded it.
    outputs.file vanillaOut
    outputs.file modOut

    args = [
        "langJson",
        mcJar.absolutePath,
        vanillaOut.absolutePath,
        modIn.absolutePath,
        modOut.absolutePath,
        dictPath.absolutePath,
        posModelPath.absolutePath,
        lemmaDictPath.absolutePath
    ]

    dependsOn tasks.named("downloadSselithModels")
}

// English book sources are translateSselith inputs only — their translated counterparts
// ship at the same JAR path, so exclude the English variants from any Copy from main resources.
def excludeEnglishBookSources = { details ->
    if (details.path.startsWith("assets/enderkinesis/texts/sselith/books/")
            && details.file.absolutePath.replace(File.separatorChar, (char) '/')
                    .contains("/src/main/resources/")) {
        details.exclude()
    }
}

// sourcesJar (added by `java { withSourcesJar() }` in the root build) also reads
// from main resources, so it must wait for translateSselith too.
tasks.named("sourcesJar") {
    dependsOn tasks.named("translateSselith")
    dependsOn tasks.named("translateLangJson")
    eachFile excludeEnglishBookSources
}

tasks.named("processResources") {
    dependsOn tasks.named("translateSselith")
    dependsOn tasks.named("translateLangJson")
    eachFile excludeEnglishBookSources
}
