plugins {
    id "com.github.johnrengelman.shadow" version "7.1.2"
    id "com.matthewprenger.cursegradle"
    id "com.modrinth.minotaur"
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin because we don't want IDEA to index this.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
}

repositories {
    maven {
        // Trinkets — accessory-slot API. modCompileOnly only; the mod is not bundled.
        name = 'TerraformersMC Maven'
        url = 'https://maven.terraformersmc.com/'
    }
    maven {
        // Cardinal Components — Trinkets' transitive dep.
        name = 'Ladysnake Maven'
        url = 'https://maven.ladysnake.org/releases'
    }
    maven {
        // Modrinth — for Sodium (compile-only block-concealment mixin target).
        name = 'Modrinth Maven'
        url = 'https://api.modrinth.com/maven'
    }
}

dependencies {
    modImplementation("net.fabricmc:fabric-loader:${fabric_loader_version}")
    common(project(path: ":common", configuration: "namedElements")) { transitive = false }
    shadowCommon(project(path: ":common", configuration: "transformProductionFabric")) { transitive = false }

    // dependencies
    modImplementation("net.fabricmc.fabric-api:fabric-api:${fabric_api_version}")
    include(annotationProcessor(implementation("io.github.llamalad7:mixinextras-fabric:0.4.1")))

    include(modApi("dev.architectury:architectury-fabric:${rootProject.architectury_api_version}"))

    //VS2
    modApi("org.valkyrienskies:valkyrienskies-120-fabric:${rootProject.vs2_version}") {
        exclude group: "com.simibubi"
        // Sodium crashes against VS2's mixin set; exclude to avoid pulling it transitively.
        exclude group: 'maven.modrinth', module: 'sodium'
        exclude group: "io.github.fabricators_of_create"
        exclude group: "dev.engine-room"
        exclude group: "dev.engine_room"
    }
    implementation("org.valkyrienskies.core:api:${rootProject.vscore_version}") {
        exclude group: 'org.joml', module: ''
    }
    implementation("org.valkyrienskies.core:util:${rootProject.vscore_version}") {
        exclude group: 'org.joml', module: ''
    }
    implementation("org.valkyrienskies.core:internal:${rootProject.vscore_version}") {
        exclude group: 'org.joml', module: ''
    }

    // Kotlin
    modImplementation("net.fabricmc:fabric-language-kotlin:${rootProject.kotlin_fabric}")

    api "org.jetbrains.kotlin:kotlin-stdlib:2.0.0"
    api "org.jetbrains.kotlin:kotlin-reflect:2.0.0"


    implementation("org.joml:joml-primitives:1.10.0")
    implementation("org.joml:joml:1.10.4")

    modRuntimeOnly("maven.modrinth:natures-compass:1.20.1-2.6.0-fabric")
    modRuntimeOnly("maven.modrinth:explorers-compass:1.20.1-2.6.0-fabric")

    // Trinkets API — accessory-slot mod (Fabric). Compile-time only; the robe armor's
    // combined-score calc plugs in via `AccessoryGatherer` at runtime if loaded.
    modCompileOnly("dev.emi:trinkets:3.7.1")

    // Sodium — chunk renderer replacement. Compile-time only; mixin into
    // `BlockRenderer.renderModel` gated by `EnderkinesisMixinPlugin` checking
    // `sodium.mixins.json` on the classpath. Without Sodium present at runtime, the
    // mixin is skipped.
    modCompileOnly("maven.modrinth:sodium:mc1.20.1-0.5.11")
}


processResources {
    // set up properties for filling into metadata
    Map<String, String> properties = Map.of(
            "vs2_version", vs2_version,
            "version", version,
            "fabric_loader_version", fabric_loader_version,
            "fabric_api_version", fabric_api_version,
            "minecraft_version", minecraft_version
    )
    properties.forEach((k, v) -> inputs.property(k, v))

    filesMatching("fabric.mod.json") {
        expand properties
    }

    // Mirror common's Sselith pack into this module for dev: Fabric uses only the module
    // containing fabric.mod.json as the mod root, so registerBuiltinResourcePack's path
    // lookup can't reach common's classpath root.
    from(rootProject.file("common/src/main/resources/resourcepacks")) {
        into "resourcepacks"
    }
    from(project(":common").layout.buildDirectory.dir("generated/sselith/resourcepacks")) {
        into "resourcepacks"
    }
    dependsOn project(":common").tasks.named("translateLangJson")
}

shadowJar {
    exclude "architectury.common.json"

    configurations = [project.configurations.shadowCommon]
    archiveClassifier.set "dev-shadow"
    // resourcepacks/sselith/ ends up in both this module's processResources output (dev mirror)
    // and common's shaded jar; skip the duplicate so shadowJar merges cleanly.
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

remapJar {
    input.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier.set null
}

jar {
    archiveClassifier.set "dev"
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

publishing {
    publications {
        mavenFabric(MavenPublication) {
            artifactId = rootProject.archives_base_name + "-" + project.name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
    }
}
